server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Versteckte Dateien (z. B. der komplette .git-Ordner) niemals ausliefern
    location ~ /\. {
        deny all;
        return 404;
    }

    # Die App ist eine einzelne HTML-Datei -> alles auf index.html leiten
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nie cachen, damit ein "git pull" sofort sichtbar ist
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
}
