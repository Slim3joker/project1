services:
  abend-hub:
    build: .
    # Alternativ ein vorgebautes Image verwenden, statt lokal zu bauen:
    # image: abend-hub:latest
    container_name: abend-hub
    restart: unless-stopped
    ports:
      - "8787:3000"       # Host-Port 8787 -> Container-Port 3000 (fuer Cloudflare-Tunnel)
    environment:
      - PORT=3000
      - TZ=Europe/Berlin
    # Liest alle Werte (NOTION_TOKEN, NOTION_DB_ID, GOOGLE_ICAL_URL, ...)
    # aus einer .env-Datei neben dieser docker-compose.yml
    env_file:
      - .env
